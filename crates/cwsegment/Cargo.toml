[package]
name = "cwsegment"
version.workspace = true
edition = "2021"
description = "cwSegment — OFX SAM object segmentation for Flame (remote SAM3 server or local ONNX)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cwtools-core = { path = "../cwtools-core" }
ureq = { version = "2.12", default-features = false }
serde_json = "1"
base64 = "0.22"
jpeg-encoder = "0.6"
png = "0.17"
# Pinned: rc.10 targets the ONNX Runtime 1.22 C API (= Flame 2027.2's bundled
# libonnxruntime.so.1.22.0). rc.11+ require 1.23 and would fail to load it.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "cuda", "std"] }

